<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <style>
        body { margin: 0; font-family: 'Urbanist', sans-serif; color: white; background: #111; overflow-x: hidden; }
        .overlay { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); }
        
        /* Estilos del GIF de la Rana */
        .gif-container {
            width: 160px; height: 160px; margin: 0 auto;
            border-radius: 50%; border: 4px solid #f7e02e;
            overflow: hidden; box-shadow: 0 0 25px rgba(247, 224, 46, 0.5);
            background: #000;
        }
        .gif-rebelde { width: 100%; height: 100%; object-fit: cover; }

        /* Botones */
        .btn-op { width: 85%; height: 80px; margin: 10px 0; background: rgba(255,255,255,0.1); color: white; border: 2px solid white; font-size: 35px; border-radius: 15px; font-weight: bold; }
        .btn-op:active { background: #8b0000; transform: scale(0.95); }
        
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; text-align: center; font-size: 18px; margin-bottom: 20px; }
        .btn-unirse { background: #8b0000; color: white; padding: 15px; width: 85%; border: 2px solid #f7e02e; border-radius: 10px; font-weight: bold; font-size: 18px; }

        /* Contenedor de botones oculto por defecto */
        #botones { display: none; width: 100%; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="overlay">
        <div id="registro" style="text-align: center; width: 100%;">
            <h2 style="color:#f7e02e;">IDENTIFÍCATE, REBELDE</h2>
            <input type="text" id="nombre" placeholder="Tu nombre...">
            <br>
            <button class="btn-unirse" id="btn-unirse">ENTRAR EN COMBATE</button>
        </div>

        <div id="espera" style="display:none; text-align:center;">
            <div class="gif-container">
                <img src="figura.gif" alt="Esperando..." class="gif-rebelde">
            </div>
            <h2 id="msg-status" style="color:#f7e02e; font-size: 28px; margin-top: 15px;">¡EN POSICIÓN!</h2>
            <p id="msg-sub" style="color: #ccc;">Espera órdenes del Comandante Piro...</p>
        </div>

        <div id="botones">
            <button onclick="enviar(0)" class="btn-op">A</button>
            <button onclick="enviar(1)" class="btn-op">B</button>
            <button onclick="enviar(2)" class="btn-op">C</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const config = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        let miId = "";
        let yaRegistrado = false;

        document.getElementById('btn-unirse').onclick = () => {
            const n = document.getElementById('nombre').value.trim();
            if(n) {
                const ref = db.ref('jugadores').push();
                miId = ref.key;
                yaRegistrado = true;
                ref.set({ nombre: n, puntos: 0 });
                document.getElementById('registro').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
                document.getElementById('botones').style.display = 'none'; // Asegura que no se vean al entrar
            }
        };

        function enviar(i) {
            if(miId) {
                db.ref('respuestasRecibidas/' + miId).set({ opIdx: i });
                document.getElementById('botones').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
                document.getElementById('msg-status').innerText = "¡ENVIADO!";
            }
        }

        db.ref('estadoJuego').on('value', snap => {
            const data = snap.val();
            if(data && data.estado === 'jugando' && miId) {
                document.getElementById('espera').style.display = 'none';
                document.getElementById('botones').style.display = 'flex'; // Solo aparece aquí
                document.getElementById('msg-status').innerText = "¡EN POSICIÓN!";
            } else {
                // En cualquier otro caso (espera, finalizado, etc.), ocultamos botones y mostramos rana
                document.getElementById('botones').style.display = 'none';
                if(miId) document.getElementById('espera').style.display = 'block';
            }
        });

        db.ref('jugadores').on('value', s => { 
            if(yaRegistrado && !s.exists()) { location.reload(); } 
        });
    </script>
</body>
</html>
