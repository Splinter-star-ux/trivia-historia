<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #2b3020; color: white; text-align: center; padding: 20px; font-family: sans-serif; }
        input { padding: 15px; width: 85%; margin: 20px 0; border-radius: 5px; border: none; }
        button { background: #8b0000; color: white; padding: 15px; border: 2px solid #ffca28; width: 90%; font-weight: bold; }
        .opcion { background: #3e4431; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="mando-box">
        <div id="pantalla-registro">
            <h2 style="color:#ffca28;">NUEVO RECLUTA</h2>
            <input type="text" id="nombre" placeholder="Tu nombre">
            <button id="btn-unirse">UNIRSE A LA LUCHA</button>
        </div>

        <div id="pantalla-espera" style="display:none;">
            <h2 style="color:#ffca28;">¡DENTRO DE LA COLUMNA!</h2>
            <p>Mantente alerta. El Comandante iniciará la operación pronto.</p>
            <div style="font-size: 3rem;">⭐</div>
        </div>

        <div id="pantalla-juego" style="display:none;">
            <h2 style="color:#ffca28;">¡FUEGO!</h2>
            <button class="opcion" onclick="alert('Enviado A')">OPCIÓN A</button>
            <button class="opcion" onclick="alert('Enviado B')">OPCIÓN B</button>
            <button class="opcion" onclick="alert('Enviado C')">OPCIÓN C</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let yaRegistrado = false;

        document.getElementById('btn-unirse').onclick = () => {
            const nom = document.getElementById('nombre').value.trim();
            if(nom) {
                db.ref('jugadores').push({ nombre: nom });
                document.getElementById('pantalla-registro').style.display = 'none';
                document.getElementById('pantalla-espera').style.display = 'block';
                yaRegistrado = true;
            }
        };

        // ESCUCHAR AL COMANDANTE
        db.ref('estadoJuego').on('value', (snap) => {
            const data = snap.val();
            if (yaRegistrado) {
                if (data && data.estado === 'jugando') {
                    document.getElementById('pantalla-espera').style.display = 'none';
                    document.getElementById('pantalla-juego').style.display = 'block';
                } else {
                    document.getElementById('pantalla-espera').style.display = 'block';
                    document.getElementById('pantalla-juego').style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
