<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="pragma" content="no-cache">

    <style>
        body { margin: 0; font-family: 'Urbanist', sans-serif; color: white; background: #000; overflow: hidden; }
        .overlay { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); }
        
        /* LA RANA */
        .gif-container {
            width: 150px; height: 150px; margin: 0 auto;
            border-radius: 50%; border: 4px solid #f7e02e;
            overflow: hidden; box-shadow: 0 0 20px #f7e02e;
        }
        .gif-rebelde { width: 100%; height: 100%; object-fit: cover; }

        /* REFUERZO 1: Ocultamos los botones con !important para que nada los muestre por error */
        #botones { 
            display: none !important; 
            width: 100%; 
            flex-direction: column; 
            align-items: center; 
        }

        .btn-op { width: 85%; height: 75px; margin: 10px 0; background: #222; color: white; border: 2px solid #f7e02e; font-size: 30px; border-radius: 15px; font-weight: bold; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; text-align: center; font-size: 18px; color: #000; }
        .btn-unirse { background: #8b0000; color: white; padding: 15px; width: 85%; border: 2px solid #f7e02e; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay">
        <div id="registro" style="text-align: center; width: 100%;">
            <h2 style="color:#f7e02e;">IDENTIFÍCATE, REBELDE</h2>
            <input type="text" id="nombre" placeholder="Tu nombre...">
            <br><br>
            <button class="btn-unirse" id="btn-unirse">ENTRAR EN COMBATE</button>
        </div>

        <div id="espera" style="display:none; text-align:center;">
            <div class="gif-container"><img src="figura.gif" class="gif-rebelde"></div>
            <h2 style="color:#f7e02e; margin-top:15px;">¡EN POSICIÓN!</h2>
            <p>Espera órdenes del Comandante...</p>
        </div>

        <div id="botones">
            <button onclick="enviar(0)" class="btn-op">A</button>
            <button onclick="enviar(1)" class="btn-op">B</button>
            <button onclick="enviar(2)" class="btn-op">C</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const config = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        
        let miId = "";
        let yaRegistrado = false;

        // REFUERZO 2: Al cargar la página, nos aseguramos de que TODO esté oculto excepto el registro
        window.onload = () => {
            document.getElementById('botones').style.setProperty('display', 'none', 'important');
            document.getElementById('espera').style.display = 'none';
        };

        document.getElementById('btn-unirse').onclick = () => {
            const n = document.getElementById('nombre').value.trim();
            if(n) {
                const ref = db.ref('jugadores').push();
                miId = ref.key;
                yaRegistrado = true;
                ref.set({ nombre: n, puntos: 0 });
                
                document.getElementById('registro').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
                // REFUERZO 3: Bloqueo extra al unirse
                document.getElementById('botones').style.setProperty('display', 'none', 'important');
            }
        };

        function enviar(i) {
            if(miId) {
                db.ref('respuestasRecibidas/' + miId).set({ opIdx: i });
                document.getElementById('botones').style.setProperty('display', 'none', 'important');
                document.getElementById('espera').style.display = 'block';
            }
        }

        db.ref('estadoJuego').on('value', snap => {
            const data = snap.val();
            const btnDiv = document.getElementById('botones');
            const espDiv = document.getElementById('espera');

            if(data && data.estado === 'jugando' && miId) {
                espDiv.style.display = 'none';
                btnDiv.style.setProperty('display', 'flex', 'important');
            } else {
                btnDiv.style.setProperty('display', 'none', 'important');
                if(miId) espDiv.style.display = 'block';
            }
        });

        db.ref('jugadores').on('value', s => { 
            if(yaRegistrado && !s.exists()) { location.reload(); } 
        });
    </script>
</body>
</html>
