<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer" class="espera-bg"></div>

    <div class="overlay">
        <div id="registro">
            <h2 style="color:#ffca28;">NOMBRE DEL REBELDE</h2>
            <input type="text" id="nombre" style="padding:15px; width:80%; border-radius:10px; border:none; margin-bottom:20px;">
            <button id="btn-unirse" style="background:#8b0000; color:white; padding:15px 40px; border:2px solid #ffca28; border-radius:10px;">UNIRSE</button>
        </div>

        <div id="espera" style="display:none;">
            <h2 style="color:#ffca28;">¡EN POSICIÓN!</h2>
            <p>Espera a que inicie la operación...</p>
        </div>

        <div id="juego" style="display:none;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%;">
                <button onclick="enviar('A')" style="height:100px; font-size:30px; background:rgba(255,255,255,0.2); border:2px solid white; color:white;">A</button>
                <button onclick="enviar('B')" style="height:100px; font-size:30px; background:rgba(255,255,255,0.2); border:2px solid white; color:white;">B</button>
                <button onclick="enviar('C')" style="height:100px; font-size:30px; background:rgba(255,255,255,0.2); border:2px solid white; color:white;">C</button>
                <button onclick="enviar('D')" style="height:100px; font-size:30px; background:rgba(255,255,255,0.2); border:2px solid white; color:white;">D</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
