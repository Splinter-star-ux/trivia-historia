<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #2b3020; color: white; text-align: center; padding: 20px; font-family: sans-serif; }
        input { padding: 15px; width: 80%; margin: 20px 0; border: none; border-radius: 5px; }
        button { background: #8b0000; color: white; padding: 15px; border: 2px solid #ffca28; width: 85%; font-weight: bold; }
        .opcion { background: #444; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="mando-box">
        <div id="pantalla-registro">
            <h2 style="color:#ffca28;">IDENTIFÍCATE</h2>
            <input type="text" id="nombre" placeholder="Tu nombre o apodo">
            <button id="btn-unirse">UNIRSE AL COMBATE</button>
        </div>

        <div id="pantalla-espera" style="display:none;">
            <h2 style="color:#ffca28;">¡EN POSICIÓN!</h2>
            <p>Espera a que el Comandante inicie la operación en la pantalla.</p>
        </div>

        <div id="pantalla-juego" style="display:none;">
            <h2 style="color:#ffca28;">ELIGE TU ATAQUE</h2>
            <button class="opcion" onclick="enviar('A')">OPCIÓN A</button>
            <button class="opcion" onclick="enviar('B')">OPCIÓN B</button>
            <button class="opcion" onclick="enviar('C')">OPCIÓN C</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn-unirse').onclick = () => {
            const nom = document.getElementById('nombre').value.trim();
            if(nom) {
                db.ref('jugadores').push({ nombre: nom });
                document.getElementById('pantalla-registro').style.display = 'none';
                document.getElementById('pantalla-espera').style.display = 'block';
            }
        };

        db.ref('estadoJuego').on('value', (snap) => {
            if(snap.val() && snap.val().estado === 'jugando') {
                document.getElementById('pantalla-espera').style.display = 'none';
                document.getElementById('pantalla-juego').style.display = 'block';
            }
        });

        function enviar(letra) { alert("Respuesta " + letra + " enviada."); }
    </script>
</body>
</html>
