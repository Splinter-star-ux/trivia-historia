<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer" class="espera-bg"></div>
    <div class="overlay">
        <div id="registro">
            <h2 style="color:#f7e02e; text-shadow: 2px 2px #000;">TU NOMBRE REBELDE</h2>
            <input type="text" id="nombre" placeholder="Ej: Piro" style="padding:15px; width:80%; border-radius:10px; border:none; text-align:center; font-size:18px;">
            <br><br>
            <button id="btn-unirse" style="background:#8b0000; color:white; padding:15px; width:80%; border:2px solid #f7e02e; border-radius:10px; font-weight:bold; font-size:18px;">ENTRAR EN COMBATE</button>
        </div>

        <div id="espera" style="display:none; text-align:center;">
            <h2 id="msg-espera" style="color:#f7e02e; font-size: 30px;">¡EN POSICIÓN!</h2>
            <p>Espera a que el Comandante lance la pregunta...</p>
        </div>

        <div id="botones" style="display:none; width:90%;">
            <div style="display:grid; grid-template-columns:1fr; gap:15px;">
                <button onclick="enviar(0)" class="btn-op">A</button>
                <button onclick="enviar(1)" class="btn-op">B</button>
                <button onclick="enviar(2)" class="btn-op">C</button>
            </div>
        </div>
    </div>

    <style>
        .btn-op { height:90px; background:rgba(255,255,255,0.1); color:white; border:2px solid white; font-size:35px; border-radius:15px; font-weight:bold; }
        .btn-op:active { background: #8b0000; transform: scale(0.95); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const config = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        let miId = "";

        document.getElementById('btn-unirse').onclick = () => {
            const n = document.getElementById('nombre').value.trim();
            if(n) {
                const ref = db.ref('jugadores').push();
                miId = ref.key;
                ref.set({ nombre: n, puntos: 0 });
                document.getElementById('registro').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
            }
        };

        function enviar(i) {
            if(miId) {
                db.ref('respuestasRecibidas/' + miId).set({ opIdx: i });
                document.getElementById('botones').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
                document.getElementById('msg-espera').innerText = "¡RESPUESTA ENVIADA!";
            }
        }

        // Cambio de pantallas automático
        db.ref('estadoJuego').on('value', snap => {
            const data = snap.val();
            if(data && data.estado === 'jugando' && miId) {
                document.getElementById('espera').style.display = 'none';
                document.getElementById('botones').style.display = 'block';
                document.getElementById('msg-espera').innerText = "¡EN POSICIÓN!";
            } else if (data && data.estado === 'finalizado') {
                document.getElementById('botones').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
                document.getElementById('msg-espera').innerText = "FIN DE LA MISIÓN";
            }
        });
    </script>
</body>
</html>
