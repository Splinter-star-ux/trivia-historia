<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer" class="espera-bg"></div>
    <div class="overlay">
        <div id="seccion-registro">
            <h2 style="color:#f7e02e;">TU NOMBRE, COMBATIENTE</h2>
            <input type="text" id="input-nombre" style="padding:15px; width:80%; border-radius:10px; border:none; text-align:center; font-size:18px;">
            <br><br>
            <button id="btn-unirse" style="background:#8b0000; color:white; padding:15px 40px; border:2px solid #f7e02e; font-weight:bold; border-radius:10px; width:80%;">UNIRSE A LA COLUMNA</button>
        </div>

        <div id="seccion-espera" style="display:none; text-align:center;">
            <h2 id="msg-espera" style="color:#f7e02e;">¡LISTO!</h2>
            <p>Espera a que el Comandante inicie la misión...</p>
        </div>

        <div id="seccion-botones" style="display:none; width:90%;">
            <h3 style="color:#f7e02e; text-align:center;">ELIGE TU RESPUESTA:</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <button onclick="responder(0)" class="btn-op">A</button>
                <button onclick="responder(1)" class="btn-op">B</button>
                <button onclick="responder(2)" class="btn-op">C</button>
                <button onclick="responder(3)" class="btn-op">D</button>
            </div>
        </div>
    </div>

    <style>
        .btn-op { height:120px; background:rgba(255,255,255,0.15); color:white; border:2px solid white; font-size:40px; font-weight:bold; border-radius:10px; }
        .btn-op:active { background:#8b0000; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const config = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        let miId = localStorage.getItem('rebeldeId') || "";

        document.getElementById('btn-unirse').onclick = () => {
            const nom = document.getElementById('input-nombre').value.trim();
            if(nom) {
                const ref = db.ref('jugadores').push();
                miId = ref.key;
                localStorage.setItem('rebeldeId', miId);
                ref.set({ nombre: nom, puntos: 0 });
                document.getElementById('seccion-registro').style.display = 'none';
                document.getElementById('seccion-espera').style.display = 'block';
            }
        };

        function responder(idx) {
            if(miId) {
                db.ref('respuestasRecibidas/' + miId).set({ opcionIdx: idx });
                document.getElementById('seccion-botones').style.display = 'none';
                document.getElementById('seccion-espera').style.display = 'block';
                document.getElementById('msg-espera').innerText = "¡ENVIADO!";
            }
        }

        db.ref('estadoJuego').on('value', snap => {
            const data = snap.val();
            if(data && data.estado === 'jugando' && miId) {
                document.getElementById('seccion-espera').style.display = 'none';
                document.getElementById('seccion-botones').style.display = 'block';
            }
        });
    </script>
</body>
</html>
