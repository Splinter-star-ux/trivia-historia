<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Rebelde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer" class="espera-bg"></div>

    <div class="overlay">
        <div id="registro">
            <h2 style="color:#f7e02e;">NOMBRE DEL REBELDE</h2>
            <input type="text" id="nombre" style="padding:15px; width:70%; border-radius:10px; border:none; margin-bottom:20px; text-align:center;">
            <button id="btn-unirse" style="background:#8b0000; color:white; padding:15px 40px; border:2px solid #f7e02e; font-weight:bold; border-radius:10px;">UNIRSE</button>
        </div>

        <div id="espera" style="display:none; text-align:center;">
            <h2 style="color:#f7e02e;">¡EN POSICIÓN!</h2>
            <p>Espera órdenes de la base...</p>
        </div>

        <div id="juego" style="display:none; width:90%;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <button onclick="enviar('A')" style="height:100px; background:rgba(255,255,255,0.1); color:white; border:2px solid white; font-size:30px;">A</button>
                <button onclick="enviar('B')" style="height:100px; background:rgba(255,255,255,0.1); color:white; border:2px solid white; font-size:30px;">B</button>
                <button onclick="enviar('C')" style="height:100px; background:rgba(255,255,255,0.1); color:white; border:2px solid white; font-size:30px;">C</button>
                <button onclick="enviar('D')" style="height:100px; background:rgba(255,255,255,0.1); color:white; border:2px solid white; font-size:30px;">D</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miId = "";

        document.getElementById('btn-unirse').onclick = () => {
            const n = document.getElementById('nombre').value;
            if(n) {
                const j = db.ref('jugadores').push();
                miId = j.key;
                j.set({ nombre: n, puntos: 0 });
                document.getElementById('registro').style.display = 'none';
                document.getElementById('espera').style.display = 'block';
            }
        };

        window.enviar = (op) => { if(miId) db.ref('respuestasRecibidas/' + miId).set({ opcion: op }); };

        db.ref('estadoJuego').on('value', snap => {
            const e = snap.val() ? snap.val().estado : 'espera';
            const bg = document.getElementById('bg-layer');
            if(bg && miId) {
                if(e === 'jugando') {
                    bg.className = 'juego-bg';
                    document.getElementById('espera').style.display = 'none';
                    document.getElementById('juego').style.display = 'block';
                } else {
                    bg.className = 'espera-bg';
                    document.getElementById('espera').style.display = 'block';
                    document.getElementById('juego').style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
