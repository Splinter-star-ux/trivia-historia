<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trivia Épica: Revolución Cubana</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000 url('fondo.jpg') no-repeat center center fixed; background-size: cover; color: white; font-family: 'Urbanist', sans-serif; overflow: hidden; }
        .overlay-bg { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.75); z-index: 1; }
        .content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .main-title { font-family: 'Playfair Display', serif; font-size: 50px; color: #f7e02e; text-transform: uppercase; margin: 0; text-shadow: 2px 2px 15px rgba(0,0,0,1); }
        
        /* Animaciones de Suspenso */
        #anim-preparados, #anim-ganador { font-size: 60px; color: #f7e02e; display: none; font-family: 'Playfair Display'; animation: glow 1s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px #f7e02e; transform: scale(1); } to { text-shadow: 0 0 30px #ff0000; transform: scale(1.1); } }

        /* Estilos de Trivia */
        #game-area { display: none; width: 90%; }
        .pregunta { font-size: 40px; color: #f7e02e; margin-bottom: 30px; font-family: 'Playfair Display'; }
        .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .opcion { background: rgba(139, 0, 0, 0.85); border: 2px solid #fff; padding: 25px; font-size: 26px; border-radius: 12px; }

        /* Notificaciones de puntos */
        #notificaciones { position: absolute; right: 20px; top: 20px; width: 300px; z-index: 100; }
        .toast { background: #2e7d32; color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 8px solid #f7e02e; animation: slideIn 0.5s; font-weight: bold; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Ranking Final Vistoso */
        #ranking-final { display: none; background: rgba(0,0,0,0.9); padding: 50px; border-radius: 30px; border: 4px solid #f7e02e; box-shadow: 0 0 50px rgba(247,224,46,0.5); width: 70%; }
        .rank-item { font-size: 35px; margin: 15px 0; border-bottom: 2px solid rgba(255,255,255,0.1); padding: 15px; display: flex; justify-content: space-between; }
        .first-place { color: #f7e02e; font-size: 45px; font-weight: bold; border-bottom: 3px solid #f7e02e; }

        .btn-host { background: #8B0000; color: white; padding: 18px 40px; border: 2px solid #f7e02e; cursor: pointer; font-weight: bold; margin: 10px; text-transform: uppercase; font-size: 16px; transition: 0.3s; }
        .btn-host:hover { background: #ff0000; box-shadow: 0 0 20px #f7e02e; }
        .btn-reset { background: #333; border-color: #777; font-size: 12px; padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="overlay-bg"></div>
    <div id="notificaciones"></div>

    <div class="content">
        <div id="pantalla-inicio">
            <h1 class="main-title">REVOLUCIÓN BAJO EL SOL DEL CARIBE</h1>
            <div id="qrcode" style="background:white; padding:15px; border-radius:15px; display:inline-block; margin:25px;"></div>
            <p style="font-weight: bold; letter-spacing: 3px;">ESCANEEN PARA UNIRSE A LA COLUMNA</p>
            <div id="lista-conectados" style="color:#f7e02e; font-size: 20px; margin: 15px;">Esperando rebeldes...</div>
            <button class="btn-host" id="btn-preparar">¡COMENZAR MISIÓN!</button>
            <br>
            <button class="btn-host btn-reset" onclick="reiniciarBaseDatos()">REINICIAR TODO EL SISTEMA</button>
        </div>

        <div id="anim-preparados">¿PREPARADOS PARA DESAFIAR SUS CONOCIMIENTOS?</div>
        <div id="anim-ganador">¿LISTOS PARA VER AL GANADOR?</div>

        <div id="game-area">
            <div class="pregunta" id="txt-pregunta"></div>
            <div class="opciones" id="opciones-box"></div>
            <button class="btn-host" id="btn-siguiente">Siguiente Pregunta</button>
        </div>

        <div id="ranking-final">
            <h1 style="color:#f7e02e; font-family:'Playfair Display'; font-size: 55px; margin-bottom: 10px;">🏆 CUADRO DE HONOR 🏆</h1>
            <div id="lista-ganadores"></div>
            <button class="btn-host" onclick="location.reload()">VOLVER AL INICIO</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        const config = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        // Generar QR infalible
        const path = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        const urlMando = window.location.origin + path + "control.html";
        new QRCode(document.getElementById("qrcode"), { text: urlMando, width: 180, height: 180 });

        const preguntas = [
            { p: "¿Qué acción marcó el inicio del movimiento el 26 de julio de 1953?", o: ["El asalto al Cuartel Moncada", "La llegada del yate Granma", "La firma de la Constitución"], c: 0 },
            { p: "¿Qué líder revolucionario NO era de nacionalidad cubana?", o: ["Camilo Cienfuegos", "Ernesto 'Che' Guevara", "Raúl Castro"], c: 1 },
            { p: "¿En qué embarcación viajaron los 82 revolucionarios?", o: ["El acorazado 'Victoria'", "El barco 'Sierra Maestra'", "El yate 'Granma'"], c: 2 },
            { p: "¿En qué fecha huyó el dictador Fulgencio Batista?", o: ["1 de enero de 1959", "24 de diciembre de 1958", "10 de octubre de 1960"], c: 0 },
            { p: "¿Dónde se refugiaron los rebeldes para organizar la guerra?", o: ["En la Habana Vieja", "En la Sierra Maestra", "En la Bahía de Cochinos"], c: 1 },
            { p: "¿Cuál fue la primera gran medida social para los campesinos?", o: ["La Ley del Turismo", "La Ley de Reforma Agraria", "La Ley de Libre Comercio"], c: 1 },
            { p: "¿Cómo se llamaba la emisora que transmitía desde la selva?", o: ["Voz de la Libertad", "Radio Habana", "Radio Rebelde"], c: 2 }
        ];

        let idx = 0;
        let jugadores = {};

        // Función Reiniciar Todo
        function reiniciarBaseDatos() {
            if(confirm("¿Estás seguro? Esto expulsará a todos y borrará los puntos.")) {
                db.ref('/').remove().then(() => {
                    alert("Sistema reseteado.");
                    location.reload();
                });
            }
        }

        document.getElementById('btn-preparar').onclick = () => {
            document.getElementById('pantalla-inicio').style.display = 'none';
            const anim = document.getElementById('anim-preparados');
            anim.style.display = 'block';
            setTimeout(() => {
                anim.style.display = 'none';
                document.getElementById('game-area').style.display = 'block';
                lanzarPregunta(0);
            }, 3000);
        };

        function lanzarPregunta(n) {
            idx = n;
            db.ref('estadoJuego').set({ estado: 'jugando', pIdx: n });
            db.ref('respuestasRecibidas').remove();
            document.getElementById('txt-pregunta').innerText = preguntas[n].p;
            const box = document.getElementById('opciones-box');
            box.innerHTML = "";
            preguntas[n].o.forEach((opt, i) => {
                box.innerHTML += `<div class="opcion">${String.fromCharCode(65+i)}) ${opt}</div>`;
            });
        }

        document.getElementById('btn-siguiente').onclick = () => {
            if(idx < preguntas.length - 1) {
                lanzarPregunta(idx + 1);
            } else {
                // Secuencia Final
                document.getElementById('game-area').style.display = 'none';
                const animG = document.getElementById('anim-ganador');
                animG.style.display = 'block';
                setTimeout(() => {
                    animG.style.display = 'none';
                    mostrarRankingFinal();
                }, 4000); // 4 segundos de suspenso
            }
        };

        db.ref('respuestasRecibidas').on('child_added', snap => {
            const r = snap.val();
            const p = jugadores[snap.key];
            if(p && parseInt(r.opIdx) === preguntas[idx].c) {
                db.ref('jugadores/' + snap.key + '/puntos').transaction(pts => (pts || 0) + 10);
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `🚩 ${p.nombre} ACERTÓ (+10)`;
                document.getElementById('notificaciones').appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }
        });

        db.ref('jugadores').on('value', s => { 
            jugadores = s.val() || {}; 
            document.getElementById('lista-conectados').innerText = s.numChildren() + " Combatientes en línea";
        });

        function mostrarRankingFinal() {
            db.ref('estadoJuego').set({ estado: 'finalizado' });
            document.getElementById('ranking-final').style.display = 'block';
            const sorted = Object.values(jugadores).sort((a,b) => b.puntos - a.puntos);
            document.getElementById('lista-ganadores').innerHTML = sorted.map((p, i) => `
                <div class="rank-item ${i === 0 ? 'first-place' : ''}">
                    <span>${i === 0 ? '🥇' : i+1 + '.'} ${p.nombre}</span>
                    <b>${p.puntos || 0} PTS</b>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
