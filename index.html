<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revolución bajo el sol del Caribe</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para las diapositivas del host */
        .slide-container { width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .active { display: flex; }
        .main-title { font-family: 'Playfair Display'; font-size: 80px; color: #ffca28; text-shadow: 2px 2px 10px black; }
        .qr-box { background: white; padding: 20px; border-radius: 10px; margin: 20px; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="slide-container active" id="s0" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondo.jpg');">
        <h1 class="main-title">REVOLUCIÓN BAJO EL SOL DEL CARIBE</h1>
        <p>EL IMPACTO QUE TRANSFORMÓ A CUBA</p>
    </div>

    <div class="slide-container" id="s1" style="background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('fondo.jpg');">
        <h2 style="color:#ffca28; font-size: 40px;">SALA DE OPERACIONES</h2>
        <div id="qrcode" class="qr-box"></div>
        <p>Escanea para unirte a la columna rebelde</p>
        <button id="btn-start" style="background:#8b0000; color:white; padding:15px 40px; border:2px solid #ffca28; cursor:pointer; font-size:20px; font-weight:bold;">INICIAR OPERACIÓN</button>
        <div id="players-list" style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>

    <div id="game-overlay">
        <div id="countdown" style="font-size: 200px; color: #ffca28;">3</div>
        <div id="question-area" style="display:none; text-align:center; width: 80%;">
            <h2 id="q-text" style="font-size: 50px;"></h2>
            <div id="timer-container" style="width:100%; height:20px; background:#333; margin: 20px 0;"><div id="timer-bar" style="width:100%; height:100%; background:#ffca28;"></div></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
