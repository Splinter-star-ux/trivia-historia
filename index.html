    <style>
        body { background: #0a0a0a; margin: 0; overflow: hidden; color: white; font-family: 'Urbanist', sans-serif; }
        .slide-container { width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .active { display: flex; }

        /* Contenedor del QR */
        .qr-area { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 20px auto; 
            display: block; 
            width: 200px; 
            height: 200px; 
        }
        
        .btn-mision { background: #8b0000; color: white; padding: 15px 50px; font-size: 24px; border: 3px solid #ffca28; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        #countdown { font-size: 200px; color: #ffca28; font-family: 'Playfair Display'; }
    </style>
