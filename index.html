<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revolución bajo el sol del Caribe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; margin: 0; overflow: hidden; color: white; }
        .slide-container { width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .active { display: flex; }
        .qr-area { background: white; padding: 20px; border-radius: 15px; margin: 20px; display: inline-block; }
        .btn-mision { background: #8b0000; color: white; padding: 15px 50px; font-size: 24px; border: 3px solid #ffca28; cursor: pointer; font-weight: bold; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="slide-container active" id="s0" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('fondo.jpg');">
        <h1 style="font-size: 70px;">REVOLUCIÓN BAJO EL SOL DEL CARIBE</h1>
    </div>

    <div class="slide-container" id="s1" style="background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('fondo.jpg');">
        <h2 style="color:#ffca28; font-size: 45px;">SALA DE MANDO</h2>
        <div id="qrcode" class="qr-area"></div>
        <p>Escanea para unirte a la columna rebelde</p>
        <button id="btn-start" class="btn-mision">INICIAR OPERACIÓN</button>
        <div id="players-list" style="margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;"></div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; background:none; border:1px solid #555; color:#555; cursor:pointer;">LIMPIAR INTERFAZ</button>
    </div>

    <div id="game-overlay">
        <div id="countdown" style="font-size: 200px; color: #ffca28;">3</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAihdShTcUktHAewx1dXLNM_D0jQWVsNUs",
            authDomain: "historia-revoluc.firebaseapp.com",
            databaseURL: "https://historia-revoluc-default-rtdb.firebaseio.com",
            projectId: "historia-revoluc",
            storageBucket: "historia-revoluc.firebasestorage.app",
            messagingSenderId: "383656491875",
            appId: "1:383656491875:web:d7111a270494cdcb58f156"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Forzar generación de QR
        window.onload = () => {
            const urlFinal = window.location.href.replace("index.html", "control.html");
            new QRCode(document.getElementById("qrcode"), { text: urlFinal, width: 200, height: 200 });
        };

        // Botón Iniciar
        document.getElementById('btn-start').onclick = () => {
            document.getElementById('game-overlay').style.display = 'flex';
            let c = 3;
            const cd = document.getElementById('countdown');
            const t = setInterval(() => {
                c--;
                if(c > 0) cd.innerText = c;
                else {
                    clearInterval(t);
                    cd.innerText = "¡YA!";
                    db.ref('estadoJuego').set({ estado: 'jugando' });
                    setTimeout(() => { document.getElementById('game-overlay').style.display='none'; }, 1000);
                }
            }, 1000);
        };

        // Navegación
        let currentS = 0;
        window.onkeydown = (e) => {
            if(e.key === "ArrowRight") {
                document.getElementById('s'+currentS).classList.remove('active');
                currentS++;
                document.getElementById('s'+currentS).classList.add('active');
            }
        };

        // Lista de jugadores
        db.ref('jugadores').on('value', snap => {
            const list = document.getElementById('players-list');
            list.innerHTML = "";
            snap.forEach(c => {
                list.innerHTML += `<span style="background:#8b0000; padding:5px 10px; border-radius:15px; border:1px solid #ffca28;">🚩 ${c.val().nombre}</span>`;
            });
        });
    </script>
</body>
</html>
