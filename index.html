<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Multimillonario - Trivia Revolucionaria</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; }
        
        /* Contenedores de Pantallas */
        .pantalla { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; }
        .activa { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Pantalla de Espera (La que ves ahora) */
        #pantalla-espera { 
            background: url('TU_GIF_DE_ESPERA.gif') no-center center/cover; 
        }

        /* Contenedor del QR y Botones */
        #info-conexion {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 2px solid #ffd700;
        }

        #qrcode { background: white; padding: 10px; margin: 20px auto; display: inline-block; }

        /* Botones Estilo Juego */
        .btn-juego {
            background: linear-gradient(#4e0000, #b30000);
            color: gold;
            padding: 15px 30px;
            border: 2px solid gold;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="pantalla-espera" class="pantalla activa">
        <div id="info-conexion">
            <h1>TRIVIA MULTIMILLONARIA</h1>
            <p>Escanea para entrar desde tu celular:</p>
            <div id="qrcode"></div>
            <br>
            <button class="btn-juego" onclick="iniciarTrivia()">EMPEZAR JUEGO</button>
        </div>
    </div>

    <div id="pantalla-juego" class="pantalla">
        <img src="TU_IMAGEN_DE_JUEGO.png" style="width: 100%; height: 100%; object-fit: cover;">
    </div>

    <script>
        // 1. CONFIGURACIÓN FIREBASE (Copia tus datos aquí)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            databaseURL: "TU_DATABASE_URL",
            projectId: "TU_PROJECT_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. GENERAR CÓDIGO QR
        // Asegúrate de que el link sea el de tu página de control móvil
        new QRCode(document.getElementById("qrcode"), {
            text: "https://tu-página.web.app/control.html",
            width: 200,
            height: 200
        });

        // 3. LÓGICA DE CAMBIO DE PANTALLA
        function iniciarTrivia() {
            document.getElementById('pantalla-espera').classList.remove('activa');
            document.getElementById('pantalla-juego').classList.add('activa');
            
            // Avisamos a Firebase que el juego empezó
            database.ref('estadoJuego').set({ activo: true });
        }

        // Escuchar si alguien más inicia el juego (desde el celular)
        database.ref('estadoJuego').on('value', (snapshot) => {
            if (snapshot.val() && snapshot.val().activo) {
                document.getElementById('pantalla-espera').classList.remove('activa');
                document.getElementById('pantalla-juego').classList.add('activa');
            }
        });
    </script>
</body>
</html>
