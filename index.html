<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revolución Cubana - Expo</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; margin: 0; overflow: hidden; color: white; font-family: 'Urbanist', sans-serif; }
        .slide-container { width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .active { display: flex; }
        .main-title { font-family: 'Playfair Display'; font-size: 70px; color: #ffca28; text-transform: uppercase; margin: 0; text-shadow: 3px 3px 10px rgba(0,0,0,0.8); }
        .qr-area { background: white; padding: 20px; border-radius: 15px; margin: 20px; display: inline-block; min-width: 200px; min-height: 200px; }
        .btn-mision { background: #8b0000; color: white; padding: 15px 50px; font-size: 24px; border: 3px solid #ffca28; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="slide-container active" id="s0" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('fondo.jpg');">
        <h1 class="main-title">REVOLUCIÓN BAJO EL SOL DEL CARIBE</h1>
        <p>EL IMPACTO QUE TRANSFORMÓ A CUBA</p>
    </div>

        <h2 style="color:#ffca28; font-size: 45px; font-family: 'Playfair Display';">SALA DE MANDO</h2>
        <div id="qrcode" class="qr-area"></div>
        <p>Escanea para unirte a la columna rebelde</p>
        <button id="btn-start" class="btn-mision">INICIAR OPERACIÓN</button>
        <div id="players-list" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px;"></div>
    </div>

    <div id="game-overlay">

            new QRCode(document.getElementById("qrcode"), { text: urlFinal, width: 200, height: 200 });
        };

        // Iniciar Misión
        document.getElementById('btn-start').onclick = () => {
            document.getElementById('game-overlay').style.display = 'flex';
            let c = 3;
            const cd = document.getElementById('countdown');
            const timer = setInterval(() => {
                c--;
                if(c > 0) cd.innerText = c;
                else {
                    clearInterval(timer);
                    cd.innerText = "¡YA!";
                    db.ref('estadoJuego').set({ estado: 'jugando' });
                    setTimeout(() => { document.getElementById('game-overlay').style.display='none'; }, 1000);
                }
            }, 1000);
        };

        // Pasar diapositivas
        let cur = 0;

            if(e.key === "ArrowRight") {
                document.getElementById('s'+cur).classList.remove('active');
                cur++;
                document.getElementById('s'+cur).classList.add('active');
            }
        };
